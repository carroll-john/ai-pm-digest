name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this job only needs to read the PR tree. The daily-digest
# workflow is the one that writes cache/ back to main.
permissions:
  contents: read

jobs:
  # Job name `validate` is referenced by branch-protection guidance in CLAUDE.md —
  # keep it stable so auto-merge waits on this check.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high

      - name: Node syntax check
        run: |
          node --check scripts/send-digest.mjs
          node --check scripts/notify-failure.mjs
          node --check scripts/redact-pii.mjs
          node --check email/template.mjs

      - name: YAML lint workflows
        run: |
          python3 -c "
          import sys, yaml, pathlib
          ok = True
          for p in pathlib.Path('.github').rglob('*.yml'):
              try:
                  yaml.safe_load(p.read_text())
                  print(f'  ok  {p}')
              except yaml.YAMLError as e:
                  print(f'FAIL  {p}: {e}', file=sys.stderr)
                  ok = False
          sys.exit(0 if ok else 1)
          "

      - name: Unit tests
        run: npm test

      # End-to-end smoke against the bundled fixture. Exercises the full
      # render path (template, source links, intro/reflection sections)
      # without hitting Anthropic or Resend, so it's safe in PR context
      # without secrets. Catches the common breakage modes: bad template
      # syntax, schema drift in sample-digest.json, missing imports.
      - name: Render sample digest (preview)
        run: node scripts/send-digest.mjs --sample --preview

      - name: Render sample digest (dry-run)
        run: node scripts/send-digest.mjs --sample --dry-run
